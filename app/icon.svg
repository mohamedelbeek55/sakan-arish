<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B4C" />
      <stop offset="100%" stop-color="#082631" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#0F766E" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Map Pin & Housing Emblem -->
  <g filter="url(#shadow)">
    <!-- Pin Body -->
    <path
      d="M32 11C23.7157 11 17 17.7157 17 26C17 37.8 32 53 32 53C32 53 47 37.8 47 26C47 17.7157 40.2843 11 32 11Z"
      fill="url(#pinGrad)"
    />

    <!-- House Silhouette Inside Pin -->
    <path
      d="M32 18L23 26H25.5V35H30V30H34V35H38.5V26H41L32 18Z"
      fill="#0D3B4C"
    />

    <!-- Window -->
    <circle cx="32" cy="24" r="1.8" fill="#FBBF24" />
  </g>
</svg>
